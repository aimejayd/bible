name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same Flutter version the project was created with (see .metadata).
          flutter-version: 3.32.0
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ijambo-bible-${{ github.run_number }}.apk

      - name: Upload APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: ijambo-bible-apk
          path: ijambo-bible-${{ github.run_number }}.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ijambo Bible build ${{ github.run_number }}
          body: Install on Android by downloading the .apk below and opening it.
          files: ijambo-bible-${{ github.run_number }}.apk

      - name: Run tests
        run: flutter test
